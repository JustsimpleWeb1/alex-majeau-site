# Éditeur de textes Pages CMS (https://app.pagescms.org).
# Un seul fichier bilingue : chaque texte a sa case FR et sa case EN, l'une sous l'autre.
# Chaque enregistrement crée un commit sur main, puis Netlify remet le site en ligne.
# Les champs doivent correspondre exactement aux clés de src/content/site.json.
media:
  input: public/images
  output: /images
content:
  - name: site
    label: "Textes du site"
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: seo
        label: "Référencement Google"
        type: object
        description: "Ce que Google et les réseaux sociaux lisent. Ça compte seulement une fois le site lancé officiellement."
        fields:
          - name: title_fr
            label: "Titre dans Google (FR)"
            type: string
            required: true
            description: "Le titre bleu dans les résultats de recherche et le titre de l'onglet. Vise 60 caractères au maximum : Google coupe le reste. Mets les mots que tes clients cherchent au début."
          - name: title_en
            label: "Titre dans Google (EN)"
            type: string
            required: true
          - name: description_fr
            label: "Description dans Google (FR)"
            type: text
            required: true
            description: "Le texte gris sous le titre dans Google, aussi utilisé quand on partage ton site sur Facebook ou LinkedIn. Vise 155 caractères au maximum."
          - name: description_en
            label: "Description dans Google (EN)"
            type: text
            required: true
          - name: image
            label: "Image de partage (Facebook, LinkedIn)"
            type: image
            required: true
            description: "L'image qui s'affiche quand quelqu'un partage ton site. Format 1200 × 630 pixels, en JPG. La même image sert en français et en anglais."
          - name: serviceName_fr
            label: "Nom de ton entreprise pour Google (FR)"
            type: string
            required: true
            description: "Comment Google présente ton service. Exemple : Alexandre Majeau, consultant Google Ads et Meta Ads."
          - name: serviceName_en
            label: "Nom de ton entreprise pour Google (EN)"
            type: string
            required: true
          - name: jobTitle_fr
            label: "Ton titre professionnel pour Google (FR)"
            type: string
            required: true
          - name: jobTitle_en
            label: "Ton titre professionnel pour Google (EN)"
            type: string
            required: true
          - name: serviceDesc_fr
            label: "Description de ton service pour Google (FR)"
            type: text
            required: true
            description: "Une phrase qui dit ce que tu fais et pour qui."
          - name: serviceDesc_en
            label: "Description de ton service pour Google (EN)"
            type: text
            required: true
          - name: area_fr
            label: "Région desservie (FR)"
            type: string
            required: true
            description: "Exemple : Québec, ou Canada."
          - name: area_en
            label: "Région desservie (EN)"
            type: string
            required: true
          - name: catalog_fr
            label: "Nom de ta liste de services (FR)"
            type: string
            required: true
          - name: catalog_en
            label: "Nom de ta liste de services (EN)"
            type: string
            required: true
          - name: svc1_fr
            label: "Service 1 (Facebook et Instagram) (FR)"
            type: string
            required: true
            description: "Nom court du service. Il s'affiche dans le pied de page et Google le lit."
          - name: svc1_en
            label: "Service 1 (Facebook et Instagram) (EN)"
            type: string
            required: true
          - name: svc2_fr
            label: "Service 2 (recherche Google) (FR)"
            type: string
            required: true
          - name: svc2_en
            label: "Service 2 (recherche Google) (EN)"
            type: string
            required: true
          - name: svc3_fr
            label: "Service 3 (Google Shopping) (FR)"
            type: string
            required: true
          - name: svc3_en
            label: "Service 3 (Google Shopping) (EN)"
            type: string
            required: true
          - name: svc4_fr
            label: "Service 4 (suivi des ventes) (FR)"
            type: string
            required: true
          - name: svc4_en
            label: "Service 4 (suivi des ventes) (EN)"
            type: string
            required: true
          - name: knowsAbout
            label: "Tes compétences pour Google"
            type: object
            description: "Les outils et sujets que tu maîtrises. Google s'en sert pour comprendre ton expertise."
            list:
              min: 1
              collapsible:
                collapsed: true
                summary: "{fr}"
            fields:
              - name: fr
                label: "Compétence (FR)"
                type: string
                required: true
              - name: en
                label: "Compétence (EN)"
                type: string
                required: true
          - name: heroPhotoAlt_fr
            label: "Description de la photo du haut (FR)"
            type: string
            required: true
            description: "Décris la photo en une phrase pour Google et les personnes aveugles. Exemple : Alexandre Majeau devant son ordinateur."
          - name: heroPhotoAlt_en
            label: "Description de la photo du haut (EN)"
            type: string
            required: true
          - name: aboutPhotoAlt_fr
            label: "Description de la photo À propos (FR)"
            type: string
            required: true
          - name: aboutPhotoAlt_en
            label: "Description de la photo À propos (EN)"
            type: string
            required: true
      - name: hero
