# Configuration de build Netlify pour le site Astro statique JSW.
# Site statique pur (astro.config : output 'static', aucun adaptateur).
# Le deploy continu : un push sur la branche de prod -> Netlify rebuild + met en ligne.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 22 LTS (le projet exige >=22.12 <23 ; les versions impaires comme 23
  # ne sont pas supportees par Astro). Aligne sur .nvmrc.
  NODE_VERSION = "22.12.0"

# Cache long et immuable des assets buildes par Astro (hash dans le nom de fichier).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
